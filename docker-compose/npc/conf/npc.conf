[common]

################################
# NPS服务器
################################

# 服务端 bridge_ip:bridge_port，端口必须和 nps.conf 的 bridge_port 一致
# 格式：地址:端口，不要带协议头，等号两边不要留空格
server_addr=47.95.122.192:9100


################################
# 通信
################################

# 必须与 nps.conf 的 bridge_type 一致；改回 tcp 时这里同步改
conn_type=kcp


################################
# 客户端密钥
################################

vkey=icl4h6omsbc3d03x

################################
# 加密压缩
################################

# crypt 走全流量 AES 加解密，是隧道吞吐和延迟最直接的 CPU 开销。
# 隧道里跑 HTTPS/SSH 这类自带加密的协议时可以关掉省 CPU；
# 若要走明文协议（如裸 HTTP、数据库）且不信任链路，再改回 true。
crypt=false
# snappy 压缩，开销很小，保留
compress=true


################################
# 自动重连
################################

auto_reconnection=true


################################
# 限速
################################

# 单位 KB/s，不填即不限速
#rate_limit=512


################################
# 连接
################################

# 并发连接上限。100 在多标签页/多资源页面上容易排队，表现为"能连但很卡"
max_conn=1000
#max_tunnel=200


################################
# 超时
################################

# 空闲连接保持时间（秒）
#disconnect_timeout=60


################################
# 标识
################################

remark=home-mini-pc
