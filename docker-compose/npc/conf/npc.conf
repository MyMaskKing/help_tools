[common]

################################
# NPS服务器
################################

server_addr=XXXXXXX:9100


################################
# 通信
################################

conn_type=tcp


################################
# 客户端密钥
################################

vkey=icl4h6omsbc3d03x


################################
# 加密压缩
################################

crypt=true
compress=true


################################
# 自动重连
################################

auto_reconnection=true


################################
# 限速
################################

#rate_limit=512


################################
# 连接
################################

max_conn=100


################################
# 标识
################################

remark=home-mini-pc
