appname = nps


################################
# 穿透核心
################################

bridge_type=tcp
bridge_port=9100
# 这个Key是服务器的密钥
vkey=cyj123456
# 这个Key是服务器-客户端配对的密钥
public_vkey=cyj123456

################################
# Web管理后台
################################

#web_host=nps.example.com
web_port=9000
web_username=admin
web_password=cyj123456


################################
# HTTP/HTTPS代理
################################

http_proxy_port=8080
https_proxy_port=8443


################################
# 性能优化
################################

# 开启数据压缩
compress=true
# 开启加密
crypt=true
# 降低日志
log_level=3
# 最大连接数
max_conn=100
# 超时时间
disconnect_timeout=60


################################
# 带宽优化
################################

# 不启用缓存
http_cache=false
# 不记录详细访问日志
http_add_origin_header=false


################################
# 安全限制
################################

# 只允许常用端口
#allow_ports=80,443,5212,5678


################################
# 心跳
################################


