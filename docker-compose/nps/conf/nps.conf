appname=nps
# 运行模式: dev | prod（不写默认 dev，Web 静态资源每次从磁盘读）
runmode=prod


################################
# 穿透核心
################################

# 桥接协议: tcp | kcp | quic
# kcp 走 UDP，用带宽换延迟，链路丢包/抖动大时能明显降低卡顿
# 回退：改回 bridge_type=tcp，并把 npc.conf 的 conn_type 也改回 tcp
bridge_type=kcp
bridge_port=9100
bridge_ip=0.0.0.0

# 服务端密钥
vkey=cyj123456
# 允许"未注册"的客户端用这个 Key 直接接入，已注册的客户端各用自己的 vkey
public_vkey=cyj123456

# 降低延迟（家宽丢包 + TCP over TCP 重传放大）的改法：
#   1) 这里改成 bridge_type=kcp
#   2) npc.conf 改成 conn_type=kcp
#   3) VPS 安全组/防火墙放行 UDP 9100
# 两端必须一致，否则客户端直接连不上。
# 切 kcp 的三个前提（缺一个就连不上）：
#   1) npc.conf 的 conn_type 也必须是 kcp
#   2) VPS 安全组放行 UDP 9100（注意是 UDP，不是 TCP）
#   3) VPS 本机防火墙（ufw/firewalld）也放行 UDP 9100
# 验证服务端确实在听 UDP：ss -lunp | grep 9100


################################
# Web 管理后台
################################

#web_host=nps.example.com
web_port=9000
web_username=admin
web_password=cyj123456
# TODO: 9000 若对公网开放，务必换掉上面的弱口令


################################
# HTTP/HTTPS 代理
################################

http_proxy_port=8080
https_proxy_port=8443


################################
# 日志
################################

# 0=emerg 1=alert 2=crit 3=error 4=warning 5=notice 6=info 7=debug
# 排查期间用 6，能看到每条连接；稳定后改回 4 或 5
log_level=6


################################
# 说明：已移除的无效配置
################################

# 原文件里的 compress / crypt / max_conn / disconnect_timeout / http_cache /
# http_add_origin_header 都不是 nps 服务端配置项，写在这里不生效，已删除：
#   - 压缩、加密、单条隧道最大连接数 → Web 后台「隧道」里配置
#   - 客户端的 crypt / compress / max_conn → npc.conf
#   - nps 没有 HTTP 缓存开关


################################
# 安全限制
################################

# 只允许常用端口
#allow_ports=80,443,5212,5678
