services:
  nps:
    image: duan2001/nps:v0.34.7
    container_name: nps
    restart: unless-stopped

    # host 网络：直接用宿主机网络栈，省掉一层 NAT，吞吐和延迟都更好。
    # 注意：必须在 Linux 宿主机上跑；Windows/macOS 的 Docker Desktop 上 host 模式行为不同，
    # 9000/9100 不一定按预期对外暴露。
    network_mode: host

    volumes:
      - ./conf:/conf
      - /etc/localtime:/etc/localtime:ro

    environment:
      TZ: Asia/Shanghai

    # 256m 在大流量/多连接时会被 OOMKilled 然后重启，表现就是"整体卡死一阵又恢复"
    mem_limit: 512m

    # 默认 nofile=1024，连接数上来后会 "too many open files" 导致连接排队
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
