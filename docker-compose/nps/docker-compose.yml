services:
  nps:
    image: duan2001/nps:v0.34.7
    container_name: nps
    restart: unless-stopped

    network_mode: host

    volumes:
      - ./conf:/conf
      - /etc/localtime:/etc/localtime:ro

    environment:
      TZ: Asia/Shanghai

    mem_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
